name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal \
            --component rustfmt --component clippy --component llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A contract module that isn't re-exported leaves the contract struct,
      # its generated Client and every helper it calls unreachable, which
      # surfaces as dead_code warnings on a plain library build.
      - name: Build without dead_code warnings
        env:
          RUSTFLAGS: "-D dead_code"
        run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

      - name: Security audit
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check documentation (catches broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Generate and print code coverage
        run: cargo llvm-cov --workspace

      - name: Generate code coverage HTML report
        run: cargo llvm-cov report --html --output-dir coverage

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  wasm-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --target wasm32v1-none --release --locked

      - name: Enforce WASM binary size budget (max 250KB per contract)
        run: |
          for f in target/wasm32v1-none/release/*.wasm; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f: $size bytes"
            if [ "$size" -gt 256000 ]; then
              echo "Error: $f exceeds 250KB size budget ($size bytes)"
              exit 1
            fi
          done
      - run: cargo build --target wasm32v1-none --release

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Generate TypeScript contract bindings
        run: make bindings

      - name: Upload TypeScript bindings
        uses: actions/upload-artifact@v4
        with:
          name: typescript-contract-bindings-${{ github.sha }}
          path: bindings/
          if-no-files-found: error

      - name: Attach TypeScript bindings to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf typescript-contract-bindings.tar.gz bindings/
          gh release upload "${{ github.event.release.tag_name }}" typescript-contract-bindings.tar.gz --clobber

      - name: Upload built .wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build-${{ github.sha }}
          path: target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
