name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin CI to the exact rustc the repo pins locally: dtolnay/rust-toolchain
      # selects the toolchain from the action's @rev, so @1.95.0 installs
      # rustc 1.95.0 — the version in rust-toolchain.toml that the deployed
      # testnet contracts were built with — instead of @stable ("latest
      # stable"). rustfmt/clippy are installed on top of that pinned toolchain.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pinned toolchain as the test job. The wasm32v1-none target is
      # installed explicitly here (locally it is auto-installed from
      # rust-toolchain.toml instead).
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --target wasm32v1-none --release
