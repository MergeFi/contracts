name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      - name: Security audit
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check documentation (catches broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Generate and print code coverage
        run: cargo llvm-cov --workspace

      - name: Generate code coverage HTML report
        run: cargo llvm-cov report --html --output-dir coverage

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --target wasm32v1-none --release --locked

      - name: Enforce WASM binary size budget (max 250KB per contract)
        run: |
          for f in target/wasm32v1-none/release/*.wasm; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f: $size bytes"
            if [ "$size" -gt 256000 ]; then
              echo "Error: $f exceeds 250KB size budget ($size bytes)"
              exit 1
            fi
          done
      - run: cargo build --target wasm32v1-none --release

      - name: Upload built .wasm artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build-${{ github.sha }}
          path: target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
