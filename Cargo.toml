[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/escrow",
    "contracts/milestones",
    "contracts/maintenance-pool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Pinned exactly (not a caret range): the deployed testnet contracts were
# built against soroban-sdk 26.1.0 (see Cargo.lock), and an exact pin removes
# one further axis of non-determinism independent of Cargo.lock being
# respected. See the README's "Reproducible builds" section for the recorded
# decision.
soroban-sdk = "=26.1.0"

# Build wasm contracts as small and fast as possible.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
