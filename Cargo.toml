[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/escrow",
    "contracts/milestones",
    "contracts/maintenance-pool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0"
publish = false
repository = "https://github.com/MergeFi/contracts"
homepage = "https://github.com/MergeFi/contracts"
documentation = "https://github.com/MergeFi/contracts#readme"
description = "Smart contracts for MergeFi, a milestone-based bounty and escrow platform on Stellar Soroban"
authors = ["MergeFi Contributors"]

[workspace.dependencies]
soroban-sdk = "26.1.0"
proptest = "1.4"

# Build wasm contracts as small and fast as possible.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
